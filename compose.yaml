services:
  httpserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: http-server:local
    ports:
      - "8080:8080"
    env_file:
      - deploy/production.env.example
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz/live"]
      interval: 30s
      timeout: 5s
      retries: 3
